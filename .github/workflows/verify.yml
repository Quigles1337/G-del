name: verify

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  kernel-check:
    name: kernel-check (pinned toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show pinned toolchain
        run: |
          cat lean-toolchain
          lean --version

      # `lake build` also enforces Godel/Receipts.lean: every #guard_msgs
      # there is an axiom-ledger assertion. A proof that starts depending
      # on a new axiom — sorryAx included — turns this step red.
      - name: Build library, executable, and axiom ledger
        run: lake build

      - name: Run the certified checker
        run: lake exe godel

      - name: Check the standalone single-file edition
        run: lean standalone/Godel.lean

      - name: Standalone/library parity
        run: bash scripts/check-parity.sh

      - name: Sorry sweep
        run: |
          if grep -rn 'sorry' --include='*.lean' . | grep -v 'sorryAx' | grep -v '^\./\.lake/'; then
            echo "FAIL: 'sorry' found in Lean sources"
            exit 1
          fi
          echo "ok"

  drift-watch:
    name: drift-watch (informational, allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # This job is a canary, not a gate. The AXIOM LEDGER does not
      # survive newer toolchains: on Lean 4.33.0, from identical source,
      # 13 of the 24 theorems in the development when first measured
      # acquire `propext`, and 15 of the 43 at the Movements E–F
      # snapshot. Since Movement G landed the job no longer reaches the
      # ledger at all: Godel/MovementG.lean fails to COMPILE on 4.33.0
      # and on 4.35.0 (an internal `mkElimApp` error at its three
      # `induction` sites), so red here currently means that compile
      # failure, not drift. ADR-0002's decision 4 is unmet until it is
      # fixed. See docs/adr/0002-toolchain-pin.md and docs/ROADMAP.md.
      - name: Build against current stable
        run: |
          elan toolchain install stable
          elan override set stable
          lean --version
          lake build
